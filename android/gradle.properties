org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# Network timeout and retry settings
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=true

# Increase network timeouts to handle slow connections
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
systemProp.https.connectionTimeout=60000
systemProp.https.socketTimeout=60000

# Enable Gradle dependency caching to prevent repeated downloads
org.gradle.dependency.verification=off

# Disable build scans to speed up builds
org.gradle.unsafe.configuration-cache=false

# Enable offline mode fallback (will use cache if available)
# org.gradle.offline=false